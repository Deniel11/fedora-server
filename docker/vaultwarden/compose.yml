services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:latest}
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.home"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:3012:3012"
