services:
  joplin-postgres:
    image: postgres:16
    container_name: joplin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joplin -d joplin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  joplin:
    image: ${JOPLIN_IMAGE:-joplin/server:latest}
    container_name: joplin
    restart: unless-stopped
    depends_on:
      joplin-postgres:
        condition: service_healthy
    environment:
      APP_BASE_URL: "https://${JOPLIN_DOMAIN}"
      APP_PORT: "${JOPLIN_PORT}"
      DB_CLIENT: pg
      POSTGRES_HOST: joplin-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${JOPLIN_PORT}:22300"
