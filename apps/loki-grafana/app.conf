APP_ID="loki-grafana"
APP_NAME="Loki + Grafana"
APP_DESCRIPTION="Search and explore Nginx access and error logs in Grafana."
GRAFANA_DOMAIN="${GRAFANA_DOMAIN:-grafana.home}"
GRAFANA_PORT="${GRAFANA_PORT:-3001}"
LOKI_PORT="${LOKI_PORT:-3100}"
LOKI_RETENTION_PERIOD="${LOKI_RETENTION_PERIOD:-30d}"
if [[ "${DOMAIN_MODE:-local}" == "public" ]]; then
    domain_prefix="${APP_SUBDOMAIN%.}"
    domain_prefix="${domain_prefix#.}"
    if [[ -n "$domain_prefix" ]]; then
        APP_DOMAIN="grafana.${domain_prefix}.${BASE_DOMAIN}"
    else
        APP_DOMAIN="grafana.${BASE_DOMAIN}"
    fi
else
    APP_DOMAIN="${GRAFANA_DOMAIN}"
fi
APP_CANONICAL_DOMAIN="${APP_DOMAIN}"
APP_DOMAIN_ALIASES=""
APP_PORT="${GRAFANA_PORT}"
APP_EXTRA_PORTS="${LOKI_PORT}"
APP_CONTAINER="grafana"
APP_TLS_NAME="grafana"
APP_NGINX_ENABLED="true"
APP_CERTIFICATE_ENABLED="true"
APP_PUBLIC_ACCESS_ALLOWED="false"
APP_CONFIG_EXTRA_SIGNATURE="${LOKI_RETENTION_PERIOD}|${APP_PUBLIC_ACCESS_ALLOWED}"
APP_DATA_DIR="/opt/fedora-server-data/loki-grafana"
APP_HEALTHCHECK_URL="http://127.0.0.1:${GRAFANA_PORT}/api/health"
