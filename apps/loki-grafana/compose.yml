services:
  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro,Z
      - ${LOKI_DATA_DIR}:/loki:Z

  alloy:
    image: grafana/alloy:v1.11.0
    container_name: grafana-alloy
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - label=disable
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${ALLOY_DATA_DIR}:/var/lib/alloy/data
      - /var/log/nginx:/var/log/nginx:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${GRAFANA_DATA_DIR}:/var/lib/grafana:Z
      - ./provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro,Z
    depends_on:
      loki:
        condition: service_started
