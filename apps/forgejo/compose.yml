services:
  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15}
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__LOCAL_ROOT_URL: http://127.0.0.1:3000/
      FORGEJO__server__DISABLE_SSH: true
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,::1/128
      FORGEJO__service__DISABLE_REGISTRATION: true
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: false
      FORGEJO__repository__DISABLE_HTTP_GIT: false
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__other__SHOW_FOOTER_VERSION: false
      FORGEJO__server__LANDING_PAGE: explore
    volumes:
      - ./data:/data:Z
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:${FORGEJO_PORT}:3000"