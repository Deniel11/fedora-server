server {
    listen 8080;
    server_name _;

    root /report;
    index index.html;

    location = /ws {
        proxy_pass http://goaccess:443/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
