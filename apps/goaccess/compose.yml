services:
  goaccess:
    image: allinurl/goaccess:1.9.4
    container_name: goaccess-processor
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]
    volumes:
      - goaccess-report:/report

  web:
    image: nginx:1.28-alpine
    container_name: goaccess-web
    restart: unless-stopped
    depends_on:
      - goaccess
    ports:
      - "127.0.0.1:${GOACCESS_PORT}:8080"
    volumes:
      - goaccess-report:/report:ro
      - ./nginx.internal.conf:/etc/nginx/conf.d/default.conf:ro,Z

volumes:
  goaccess-report:
