APP_ID="goaccess"
APP_NAME="GoAccess"
GOACCESS_DOMAIN="${GOACCESS_DOMAIN:-goaccess.home}"
GOACCESS_PORT="${GOACCESS_PORT:-7891}"

if [[ "${DOMAIN_MODE:-local}" == "public" ]]; then
    if [[ -n "${APP_SUBDOMAIN:-home}" && "${APP_SUBDOMAIN:-home}" != "." ]]; then
        APP_DOMAIN="goaccess.${APP_SUBDOMAIN#.}.${BASE_DOMAIN}"
    else
        APP_DOMAIN="goaccess.${BASE_DOMAIN}"
    fi
else
    APP_DOMAIN="${GOACCESS_DOMAIN}"
fi

APP_CANONICAL_DOMAIN="${APP_DOMAIN}"
APP_DOMAIN_ALIASES=""
APP_PORT="${GOACCESS_PORT}"
APP_CONTAINER="goaccess-web"
APP_TLS_NAME="goaccess"
APP_NGINX_ENABLED="true"
APP_CERTIFICATE_ENABLED="true"
APP_HEALTHCHECK_URL="http://127.0.0.1:${GOACCESS_PORT}/"
