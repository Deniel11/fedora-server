server {
    listen 80;
    __IPV6_HTTP_LISTENER__
    server_name __FEDORA_DOMAIN__;
    __ACCESS_RULES__

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    __IPV6_HTTPS_LISTENER__
    http2 on;
    server_name __FEDORA_DOMAIN__;
    __ACCESS_RULES__

    ssl_certificate __FEDORA_CERTIFICATE__;
    ssl_certificate_key __FEDORA_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:__FEDORA_PORT__;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        gzip off;
    }
}
